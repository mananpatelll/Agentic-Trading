models:
  defaults:
    model: gpt-4.1-2025-04-14
    temperature: 0
    max_retries: 3

  # Per-agent model choice. Anything omitted falls back to defaults above.
  roles:
    technical: {model: gpt-4o}
    market:    {model: gpt-4o}
    news:      {model: gpt-4.1-2025-04-14}
    trader:    {model: gpt-4.1-2025-04-14}

  # Shared by every agent in the process, so this caps TOTAL request rate.
  # Sized for a top_k=5 scan: the specialist fan-out bursts ~10 calls at once,
  # then news tool-loops and trader risk-gate retries trail off, so a full run
  # is roughly 20-45 requests. The bucket absorbs the opening burst; the rate
  # covers the tail at ~180 req/min, well under the 500 RPM tier-1 ceiling.
  # Lower requests_per_second if 429s appear (token-per-minute limits bind
  # before request limits do on lower tiers).
  rate_limit:
    requests_per_second: 3
    max_bucket_size: 10


scanner:
  min_dollar_volume: 20000000 
  rsi_oversold: 30
  rsi_overbought: 70
  vol_spike_mult: 2.0
  min_signals: 2
  top_k: 5


Risk: 
  min_rr_ratio: 1.5 
  max_trades_per_day: 5 
