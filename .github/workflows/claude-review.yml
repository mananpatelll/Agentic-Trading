name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# contents:write is needed by the merge step only. Claude's own tool list
# stays read-only (see --allowedTools), so the model can never write here:
# it renders a verdict, and the deterministic step below acts on it.
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # OIDC token the action exchanges for its GitHub App token

# A new push supersedes the review in flight; don't pay for both.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the diff against base resolves

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} of ${{ github.repository }}.

            Read the diff with `gh pr diff ${{ github.event.pull_request.number }}`.
            Read the surrounding code with Read/Grep/Glob before judging anything —
            a diff alone does not tell you whether a call site still holds.

            This repo is an LLM trading desk built on LangGraph. Judge correctness
            in this priority order and ignore formatting and style preferences:

              1. Anything that stops execution: syntax errors, NameError/KeyError,
                 bad imports, unhandled exceptions on the happy path.
              2. Concurrency hazards: shared mutable state across graph nodes,
                 races on lazily-initialised globals, unsafe use of the sqlite
                 checkpointer or the shared LLM clients in src/llm.py.
              3. Logic errors in trading or risk code, where a silently wrong
                 number is worse than a crash.

            Watch for exceptions swallowed by a broad `except` that turn a real
            bug into a plausible-looking no_trade.

            Then post exactly ONE verdict, and nothing else:
              - Nothing found in categories 1-3:
                  gh pr review ${{ github.event.pull_request.number }} --approve --body "<summary>"
              - Otherwise:
                  gh pr review ${{ github.event.pull_request.number }} --request-changes --body "<findings>"

            Start the body with "## 🤖 Reviewed by Claude" and keep it under 30
            lines. Cite every finding as `path/file.py:line`. If you approve, state
            what you actually verified — never approve with an empty or vague body.
          # Temporary: prints the tool calls so we can see which ones are being
          # denied. Both review runs so far burned ~45% of their turns on
          # denials. Remove once the allowlist is right.
          show_full_output: true
          claude_args: |
            --model claude-sonnet-5
            --max-turns 20
            --allowedTools "Read,Grep,Glob,TodoWrite,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"

      # Plain shell, not the model: Claude renders the verdict, this acts on it.
      # An approval it did not actually give cannot merge anything.
      #
      # Owner's PRs only. Contributors still get the full review above; their
      # PRs just wait for a human to press merge. The repo is public, so code
      # from outside must not reach main unseen.
      - name: Merge when approved
        if: github.event.pull_request.user.login == github.repository_owner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The review lands during the step above; allow for API propagation.
          for i in 1 2 3; do
            decision=$(gh pr view "$PR" --json reviewDecision --jq '.reviewDecision')
            [ -n "$decision" ] && break
            sleep 5
          done
          echo "review decision: ${decision:-<none>}"

          if [ "$decision" != "APPROVED" ]; then
            echo "Not approved — leaving open for a human."
            exit 0
          fi

          gh pr merge "$PR" --merge --delete-branch
